name: Bug report
description: Something did not work the way this repository says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use the private advisories form instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The page shape and the returned JSON, copied as text. Use a throwaway page, never a real account page.
      placeholder: |
        $ sh docs/demo/run.sh
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you installed, and the browser that ran the snippet.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A small reproduction, or what you already tried.
    validations:
      required: false
