name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # ubuntu-latest ships Google Chrome; the live test measures a local page with it.
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
